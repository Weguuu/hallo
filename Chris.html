                <textarea style="width: 90%; height: 200px; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">I want to start this off with my sincerest gratitude with you accepting me to be a part of your life, subsequently, mine. For I never once thought that I will be able to fall in love again in light of my past ventures. I guess love does comes in the most unexpected of times, and I certainly did not expect that I, of all people, would get to officially be with someone who's as perfect as you. You may see it otherwise, but in my eyes, those words stands factual.

                    Everything has been a total bliss thus far with you, baby. Overshadowing everything bad with a simple thought of you, making my day brighter and lighter.
                    
                    I love you for everything that I am, always striving to be better, be the best that no one ever was for you (Oh no is that a Pokemon reference?!?!?!?!?? LARO ASKDLASKDA). Taking every step with a smile and with utmost motivation in helping us achieve the happyness we so desire.

                    I do hope you know, 
                    that I am more than willing to carry you home.
                    
                    Whether it's tonight
                    or a 100 years down the road.

                    I don't want you to wonder, darling
                    Because I need you the most.
                    
                    In each and every life,
                    I choose us everytime.
                    
                    Together, here and now
                    to the eversweet hereafter of the future.
                    
                    Happy birthday, my love.</textarea>

    <script>
        const correctUsername = "102724";
        const correctPassword = "Bumble";
        const hints = [
            "It's the date you and I first met.",
            "It's where we met.",
            "The username's our monthsary.",
            "Username date order:No spaces + mmddyear",
            "Capital first letter ng password, and yes app siya :>"
        ];
        let hintIndex = 0;

        function checkLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            if (username === correctUsername && password === correctPassword) {
                document.getElementById("login-section").classList.add("hidden");
                document.getElementById("content-section").classList.remove("hidden");
            } else {
                alert("Again, bebuu. You know where and when we met <3");
            }
        }

        function showHints() {
            const hintBox = document.getElementById("hint-box");
            hintBox.textContent = hints[hintIndex];
            hintIndex = (hintIndex + 1) % hints.length;
        }

        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    </script>
